[project]
name = "casahome-mcp"
version = "0.1.0"
description = "Local read-oriented MCP adapter for python-casahome"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "python-casahome>=0.2.0,<0.3",
    "mcp>=2,<3",
    "aiohttp>=3.9,<4",
    "pydantic>=2.12,<3",
    "jsonschema>=4.26,<5",
]

[project.scripts]
casahome-mcp = "casahome_mcp.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10", "types-jsonschema"]

[tool.uv.sources]
python-casahome = { git = "https://github.com/borski/python-casahome", tag = "v0.2.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/casahome_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "pyproject.toml", "uv.lock", "README.md", "LICENSE", ".gitignore"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
