[project]
name = "casahome-mcp"
version = "0.2.0"
description = "Casa MCP reads and explicitly confirmed, default-deny actions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["casa", "casahome", "mcp", "model-context-protocol", "home-membership"]
dependencies = [
    "python-casahome>=0.3,<0.4",
    "mcp>=2,<3",
    "aiohttp>=3.9,<4",
    "pydantic>=2.12,<3",
    "jsonschema>=4.26,<5",
]

[project.urls]
Homepage = "https://github.com/borski/casahome-mcp"
Repository = "https://github.com/borski/casahome-mcp"
Issues = "https://github.com/borski/casahome-mcp/issues"

[project.scripts]
casahome-mcp = "casahome_mcp.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10", "types-jsonschema"]

# TEMPDEV: SDK 0.3 is unpublished. Remove this source before releasing.
[tool.uv.sources]
python-casahome = { path = "../python-casahome", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/casahome_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "pyproject.toml", "uv.lock", "README.md", "LICENSE", ".gitignore"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
